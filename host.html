<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Music Roulette · ведучий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/tmi.min.js"></script>
</head>
<body class="host">
<header class="topbar">
  <a class="logo" href="./"><img src="img/logo-small.png" alt="Music Roulette" width="111" height="50"></a>
  <!-- У новій вкладці: сторінка ведучого — «сервер» гри, її не можна закривати. -->
  <nav><a href="history.html" target="_blank" rel="noopener">Історія ігор ↗</a></nav>
  <div class="top-stage"><div id="top-stage"></div><div id="countdown" class="countdown"></div></div>
  <div id="auth"></div>
</header>
<main class="host-layout">
  <!-- Ліва колонка: сцена для OBS (захоплюй лише її). -->
  <section class="stage-col">
    <div id="stage"></div>
    <div id="reel" class="reel big"></div>
    <div id="player" class="player"></div>
  </section>
  <!-- Права колонка: керування, у кадр не потрапляє. -->
  <aside class="side-col">
    <div id="control"></div>
    <div class="panel volume">
      <label for="volume-range">Гучність треків <b id="volume-value">50%</b></label>
      <input id="volume-range" type="range" min="0" max="100" step="1" value="50">
    </div>
    <div id="seats"></div>
    <details open><summary>Журнал</summary><ul id="log" class="log"></ul></details>
  </aside>
</main>
<script type="module" src="js/host.js"></script>
</body>
</html>
